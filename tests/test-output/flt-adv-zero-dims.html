<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Converted Document</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%;overflow:hidden;}
    body{font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#111827;background:#fff;overflow:hidden;-webkit-font-smoothing:antialiased;}
    .page-frame{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#fff;}
    .viewer-header{height:52px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #e5e7eb;background:rgba(255,255,255,.92);backdrop-filter:blur(10px) saturate(1.2);flex-shrink:0;z-index:8;}
    .viewer-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:-.01em;color:#0f172a;white-space:nowrap;flex-shrink:0;}
    .viewer-brand-icon{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,#5b5bf6,#8b5cf6);color:#fff;flex-shrink:0;}
    .viewer-docname{flex:1;min-width:0;text-align:center;font-size:13px;font-weight:600;color:#1f2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px;}
    .viewer-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
    .viewer-action{appearance:none;border:1px solid #e5e7eb;background:#fff;color:#374151;cursor:pointer;width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;}
    .viewer-action:hover{background:#f9fafb;border-color:#d1d5db;transform:translateY(-1px);box-shadow:0 1px 6px rgba(0,0,0,.06);}
    .viewer-action:focus-visible{outline:2px solid #6366f1;outline-offset:2px;}
    .viewer-action.primary{border-color:#6366f1;background:#6366f1;color:#fff;}
    .viewer-action.primary:hover{background:#4f46e5;}
    .viewer-title{padding:8px 16px 8px;border-bottom:1px solid #f3f4f6;background:#fff;flex-shrink:0;}
    .viewer-title .doc-title{margin:0;font-size:14px;font-weight:600;line-height:1.4;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .viewer{display:flex;flex:1;min-height:0;overflow:hidden;background:#f3f4f6;}
    .viewer-sidebar{width:280px;min-width:280px;max-width:280px;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;transition:width .22s cubic-bezier(.2,.8,.2,1),min-width .22s cubic-bezier(.2,.8,.2,1),opacity .18s ease,transform .22s ease;}
    .viewer.viewer--sidebar-collapsed .viewer-sidebar{width:0;min-width:0;max-width:0;border-right-width:0;opacity:0;pointer-events:none;transform:translateX(-8px);overflow:hidden;}
    .sidebar-header{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#6b7280;white-space:nowrap;flex-shrink:0;}
    .sidebar-title{flex:1;overflow:hidden;text-overflow:ellipsis;}
    .sidebar-header-actions{display:flex;gap:4px;}
    .toc-search-wrap{padding:0 10px 8px;flex-shrink:0;}
    .toc-search{position:relative;}
    .toc-search input{width:100%;padding:7px 28px 7px 30px;font-size:13px;line-height:1;border:1px solid #e5e7eb;border-radius:8px;background:#f9fafb;color:#111827;outline:none;transition:border-color .15s,box-shadow .15s,background .15s;}
    .toc-search input::placeholder{color:#9ca3af;}
    .toc-search input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12);background:#fff;}
    .toc-search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:#9ca3af;pointer-events:none;}
    .toc-search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);appearance:none;border:0;background:transparent;color:#9ca3af;cursor:pointer;width:20px;height:20px;border-radius:6px;display:none;align-items:center;justify-content:center;}
    .toc-search-clear.visible{display:inline-flex;}
    .toc-search-clear:hover{background:#f3f4f6;color:#374151;}
    .toc-no-results{padding:14px 10px;color:#9ca3af;font-size:13px;text-align:center;display:none;}
    .toc-no-results.visible{display:block;}
    .toc{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 8px 12px;scrollbar-width:thin;}
    .toc-empty{color:#888;font-size:13px;padding:12px;}
    .toc-tree{list-style:none;margin:0;padding:0;}
    .toc-tree ul{list-style:none;margin:0;padding-left:14px;}
    .toc-row{display:flex;align-items:center;gap:2px;}
    .toc-link{flex:1;display:block;padding:5px 8px;font-size:13px;line-height:1.35;color:#374151;text-decoration:none;border-radius:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .12s,color .12s,transform .12s;}
    .toc-link:hover{background:#f3f4f6;color:#111827;}
    .toc-link.is-active{background:#eef2ff;color:#3730a3;font-weight:600;box-shadow:inset 3px 0 0 #6366f1;}
    .toc-link:focus-visible{outline:2px solid #6366f1;outline-offset:1px;}
    .toc-link.is-search-hidden{display:none;}
    .toc-mark{background:#fef08a;color:#854d0e;padding:1px 2px;border-radius:3px;font-weight:600;}
    .toc-parent{margin:1px 0;}
    .toc-parent.is-collapsed>ul.toc-children{display:none;}
    .toc-parent.is-search-hidden{display:none;}
    .toc-toggle{appearance:none;border:0;background:transparent;cursor:pointer;width:22px;height:22px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#9ca3af;border-radius:6px;transition:all .15s;}
    .toc-toggle::before{content:"▾";display:block;font-size:10px;transition:transform .18s;}
    .toc-parent.is-collapsed>.toc-row .toc-toggle::before{transform:rotate(-90deg);}
    .toc-toggle:hover{background:#f3f4f6;color:#374151;}
    .toc-toggle:focus-visible{outline:2px solid #6366f1;}
    .toc-leaf{padding-left:24px;}
    .toc-leaf.is-search-hidden{display:none;}
    .doc-main{flex:1;overflow-y:auto;overflow-x:hidden;background:#f1f2f4;padding:0;display:flex;flex-direction:column;align-items:center;min-width:0;scroll-behavior:smooth;}
    .doc-toolbar{position:sticky;top:0;z-index:5;width:100%;max-width:860px;display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(241,242,244,.92);backdrop-filter:blur(8px);flex-shrink:0;}
    .focus-banner{width:100%;max-width:860px;margin:0 auto;padding:10px 16px 8px;display:none;align-items:center;gap:10px;}
    .focus-banner.visible{display:flex;animation:fadeIn .18s ease;}
    .focus-banner-inner{flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid #e0e7ff;border-radius:12px;box-shadow:0 4px 18px rgba(99,102,241,.08);}
    .focus-banner-kicker{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6366f1;white-space:nowrap;}
    .focus-banner-title{flex:1;min-width:0;font-size:13px;font-weight:600;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .focus-banner-clear{appearance:none;border:1px solid #e5e7eb;background:#fff;color:#374151;cursor:pointer;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap;}
    .focus-banner-clear:hover{background:#f9fafb;border-color:#d1d5db;}
    .focus-banner-close{appearance:none;border:0;background:transparent;color:#9ca3af;cursor:pointer;width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;}
    .focus-banner-close:hover{background:#f3f4f6;color:#374151;}
    .sidebar-toggle-main{appearance:none;border:1px solid #e5e7eb;background:#fff;cursor:pointer;padding:7px 12px;border-radius:8px;font-size:13px;line-height:1;display:inline-flex;align-items:center;gap:6px;color:#374151;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:all .15s;}
    .sidebar-toggle-main:hover{background:#f9fafb;transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.06);}
    .sidebar-toggle-main:focus-visible{outline:2px solid #6366f1;outline-offset:2px;}
    .docx-page{background:#fff;margin:12px auto 48px;box-shadow:0 8px 32px rgba(15,23,42,.08),0 0 0 1px rgba(15,23,42,.04);width:100%;max-width:860px;position:relative;flex-shrink:0;box-sizing:border-box;border-radius:10px;overflow:hidden;transition:transform .22s ease,opacity .18s ease;}
    .docx-page[style]{max-width:min(860px,calc(100% - 32px)) !important;}
    .docx-block{transition:opacity .18s ease,transform .18s ease;}
    .docx-block.is-hidden{display:none !important;}
    .docx-block.is-entering{animation:docFadeIn .22s ease both;}
    @keyframes docFadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
    .docx-float-wrap.is-hidden{display:none !important;}
    .docx-float-wrap{position:static;}
    .docx-para-float-wrap.is-hidden{display:none !important;}
    .docx-para-float-wrap{position:static;}
    img[data-anchor].is-hidden{display:none !important;}
    img.docx-float.is-hidden, img.docx-float-wrapped.is-hidden{display:none !important;}
    .docx-hf-float-wrap{position:static;}
    #exit-focus{margin-left:auto;}
    button.sidebar-toggle-main[hidden]{display:none !important;}
    .docx-content{box-sizing:border-box;max-width:100%;overflow-wrap:break-word;font-size:11.0pt;}
    img.docx-float{position:absolute;}
    img.docx-float-wrapped{position:static;max-width:none;}
    img.docx-float-topbottom{display:block; clear:both; float:none; max-width:100%; margin-left:auto; margin-right:auto;}
    img.docx-float-topbottom.is-hidden{display:none !important;}
    .docx-number{font:inherit;font-weight:inherit;font-style:inherit;margin-right:.4em;white-space:nowrap;}
    .docx-bullet{margin-right:.4em;}
    nav.toc .docx-number{margin-right:.4em;}
    .docx-list{margin:0.6em 0 0.6em 1.8em;padding:0;}
    .docx-list li{margin:0.15em 0;}
    .docx-list li p{margin:0;}
    .docx-ordered-list{list-style:none;padding-left:0;}
    .docx-bullet-list{list-style:none;padding-left:0;}
    table.docx-table{border-collapse:collapse;width:100%;margin:1em 0;}
    table.docx-table td,table.docx-table th{border:1px solid #d1d5db;padding:6px 8px;vertical-align:top;word-wrap:break-word;}
    table.docx-table td p{margin:0;}
    header.docx-header,footer.docx-footer{border:1px dashed #cbd5e1;padding:6px 8px;margin:6px 0;background:#f8fafc;}
    header.docx-header p,footer.docx-footer p{margin:0; position:relative; min-height:1.2em;}
    .docx-tab{display:inline-block;width:48px;}
    .docx-tab-leader{position:absolute; height:0; pointer-events:none;}
    .docx-tab-segment{white-space:nowrap;}
    .docx-page-number,.docx-num-pages,.docx-page-ref{display:inline-block;min-width:1.2em;padding:0 2px;background:#eef2ff;border:1px dashed #a5b4fc;border-radius:3px;font-size:0.85em;color:#4f46e5;vertical-align:baseline;}
    .docx-page-number::after{content:"[PAGE]";}
    .docx-num-pages::after{content:"[NUMPAGES]";}
    .docx-page-ref::after{content:"[PAGEREF]";}
    .docx-footnote-ref{font-size:0.75em;vertical-align:super;line-height:0;}
    .docx-footnote-ref a,.docx-endnote-ref a,.docx-comment-ref a{color:#4f46e5;text-decoration:none;border-bottom:1px dotted #a5b4fc;}
    .docx-footnote-ref a:hover,.docx-endnote-ref a:hover,.docx-comment-ref a:hover{color:#3730a3;border-bottom-style:solid;}
    .docx-comment-ref{font-size:0.75em;vertical-align:super;line-height:0;}
    .docx-footnotes,.docx-endnotes,.docx-comments{margin-top:2em;padding-top:1em;border-top:1px solid #e5e7eb;font-size:0.9em;}
    .docx-footnotes h2,.docx-endnotes h2,.docx-comments h2{font-size:13px;font-weight:700;color:#374151;margin:0 0 0.8em;}
    .docx-footnote,.docx-endnote,.docx-comment{margin:0.6em 0;padding:4px 8px;border-radius:6px;}
    .docx-footnote:target,.docx-endnote:target,.docx-comment:target,.docx-comment-reply:target{background:#eef2ff;outline:2px solid #a5b4fc;}
    .docx-comment-reply{margin:0.6em 0 0.6em 1.2em;padding:4px 8px;border-radius:6px;border-left:2px solid #e0e7ff;background:#f8fafc;}
    .docx-comment-replies{margin-top:0.6em;}
    .docx-comment-range{background:#fef9c3;border-radius:3px;padding:0 1px;box-decoration-break:clone;-webkit-box-decoration-break:clone;cursor:pointer;transition:background .15s;}
    .docx-comment-range:hover{background:#fde68a;}
    .docx-comment-range.is-active{background:#fde68a;outline:1px solid #f59e0b;}
    .docx-footnote-backref,.docx-endnote-backref,.docx-comment-backref{margin-left:0.5em;color:#6366f1;text-decoration:none;font-weight:600;}
    .docx-footnote-backref:hover,.docx-endnote-backref:hover,.docx-comment-backref:hover{color:#3730a3;}
    .sidebar-overlay{position:fixed;inset:0;background:rgba(15,23,42,.32);backdrop-filter:blur(2px);z-index:15;opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s;}
    .sidebar-overlay.visible{opacity:1;visibility:visible;}
    @media (max-width:780px){.viewer-sidebar{position:fixed;left:0;top:0;bottom:0;z-index:20;width:280px;min-width:280px;max-width:280px;transform:translateX(-100%);transition:transform .24s cubic-bezier(.2,.8,.2,1);opacity:1;pointer-events:auto;border-right:1px solid #e5e7eb;box-shadow:12px 0 40px rgba(15,23,42,.12);}
    .viewer.viewer--mobile-open .viewer-sidebar{transform:translateX(0);}
    .viewer.viewer--sidebar-collapsed .viewer-sidebar{width:280px;min-width:280px;max-width:280px;opacity:1;pointer-events:auto;transform:translateX(-100%);border-right-width:1px;box-shadow:12px 0 40px rgba(15,23,42,.12);}
    .viewer.viewer--mobile-open.viewer--sidebar-collapsed .viewer-sidebar{transform:translateX(0);}
    .viewer-header{padding:0 10px;gap:8px;}
    .viewer-docname{font-size:12px;padding:0 6px;}
    .doc-main{padding-top:0;}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important;}}
  </style>
</head>

  <script>
  (function(){
    var viewer=document.querySelector('.viewer');
    var sidebar=document.getElementById('viewer-sidebar');
    var overlay=document.getElementById('sidebar-overlay');
    var toggle=document.getElementById('sidebar-toggle');
    var docMain=document.getElementById('doc-main');
    if(!viewer||!sidebar||!overlay||!toggle||!docMain) return;
    var mq=window.matchMedia('(max-width: 780px)');
    function isMobile(){return mq.matches;}
    function setSidebarOpen(open){
      if(isMobile()){
        viewer.classList.toggle('viewer--mobile-open',open);
        if(open){ overlay.hidden=false; overlay.classList.add('visible'); } else { overlay.classList.remove('visible'); setTimeout(function(){ if(!viewer.classList.contains('viewer--mobile-open')) overlay.hidden=true; },180); }
        viewer.classList.toggle('viewer--sidebar-collapsed',!open);
      } else {
        viewer.classList.toggle('viewer--sidebar-collapsed',!open);
        viewer.classList.remove('viewer--mobile-open');
        overlay.hidden=true; overlay.classList.remove('visible');
      }
      toggle.setAttribute('aria-expanded',String(open));
      toggle.setAttribute('aria-label',open?'Close outline':'Open outline');
      var ht=document.getElementById('header-toc'); if(ht){ ht.setAttribute('aria-expanded',String(open)); }
    }
    function isSidebarOpen(){
      if(isMobile()) return viewer.classList.contains('viewer--mobile-open');
      return !viewer.classList.contains('viewer--sidebar-collapsed');
    }
    toggle.addEventListener('click',function(){setSidebarOpen(!isSidebarOpen());});
    var headerToc=document.getElementById('header-toc'); if(headerToc) headerToc.addEventListener('click',function(){setSidebarOpen(!isSidebarOpen());});
    var sideCollapse=document.getElementById('sidebar-collapse'); if(sideCollapse) sideCollapse.addEventListener('click',function(){setSidebarOpen(false);});
    overlay.addEventListener('click',function(){setSidebarOpen(false);});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&isMobile()&&isSidebarOpen()) setSidebarOpen(false);});
    setSidebarOpen(!isMobile());
    var mqListener=function(){setSidebarOpen(!isMobile());};
    if(mq.addEventListener) mq.addEventListener('change',mqListener); else if(mq.addListener) mq.addListener(mqListener);
    var tocNav=document.querySelector('nav.toc');
    if(tocNav){
      tocNav.addEventListener('click',function(e){
        var btn=e.target.closest('.toc-toggle');
        if(!btn) return;
        var li=btn.closest('.toc-parent');
        if(!li) return;
        var collapsed=li.classList.toggle('is-collapsed');
        var expanded=!collapsed;
        btn.setAttribute('aria-expanded',String(expanded));
        li.setAttribute('aria-expanded',String(expanded));
        var uid=btn.getAttribute('aria-controls');
        var ul=document.getElementById(uid);
        if(ul) ul.hidden=!expanded;
      });
    }
    var titleEl=document.querySelector('.viewer-title .doc-title[id]');
    var titleId=titleEl?titleEl.id:null;
    var headings=Array.from(docMain.querySelectorAll('h1[id],h2[id],h3[id],h4[id],h5[id],h6[id]'));
    var linkById={};
    document.querySelectorAll('a.toc-link[href^="#"]').forEach(function(a){linkById[a.getAttribute('href').slice(1)]=a;});
    var activeId=null;
    function setActive(id){
      if(activeId===id) return;
      if(activeId&&linkById[activeId]){linkById[activeId].classList.remove('is-active');linkById[activeId].removeAttribute('aria-current');}
      activeId=id;
      var link=linkById[id];
      if(!link) return;
      link.classList.add('is-active');
      link.setAttribute('aria-current','location');
      var el=link.closest('li');
      while(el){
        var parent=el.parentElement.closest('li.toc-parent');
        if(parent){
          parent.classList.remove('is-collapsed');
          var b=parent.querySelector(':scope > .toc-row > .toc-toggle');
          if(!b) b=parent.querySelector('.toc-toggle');
          if(b){b.setAttribute('aria-expanded','true');var u=document.getElementById(b.getAttribute('aria-controls'));if(u) u.hidden=false;}
          parent.setAttribute('aria-expanded','true');
          el=parent;
        } else break;
      }
      try{link.scrollIntoView({block:'nearest'});}catch(e){}
    }
    var currentFocus=null;
    var exitBtn=document.getElementById('exit-focus');
    var focusBanner=document.getElementById('focus-banner');
    var focusBannerTitle=document.getElementById('focus-banner-title');
    var focusClear=document.getElementById('focus-banner-clear');
    var focusClose=document.getElementById('focus-banner-close');
    function showExit(on, title){
      if(exitBtn) exitBtn.hidden=!on;
      if(focusBanner){
        if(on){ focusBanner.classList.add('visible'); if(focusBannerTitle && title) focusBannerTitle.textContent=title; }
        else { focusBanner.classList.remove('visible'); }
      }
    }
    function getHeadingText(id){
      var a=linkById[id]; if(a) return a.textContent.trim();
      var h=document.getElementById(id); if(h) return h.textContent.trim();
      return id;
    }
    function clearFocus(){
      var bs=docMain.querySelectorAll('.docx-block');
      for(var i=0;i<bs.length;i++){ bs[i].classList.remove('is-hidden'); bs[i].classList.remove('is-entering'); }
      var fs=docMain.querySelectorAll('.docx-float-wrap, .docx-para-float-wrap, img[data-anchor]');
      for(var i=0;i<fs.length;i++){ fs[i].classList.remove('is-hidden'); }
      showExit(false);
      currentFocus=null;
      docMain.scrollTop=0;
    }
    function focusHeading(id){
      if(!id) return;
      var link=linkById[id];
      if(!link) return;
      var level=parseInt(link.getAttribute('data-level')||'0',10)||1;
      var blocks=Array.prototype.slice.call(docMain.querySelectorAll('.docx-block'));
      var startIdx=-2;
      if(id===titleId){ startIdx=-1; }
      else { for(var i=0;i<blocks.length;i++){ if(blocks[i].getAttribute('data-heading-id')===id){ startIdx=i; break; } } }
      if(startIdx===-2) return;
      for(var i=0;i<blocks.length;i++){ blocks[i].classList.add('is-hidden'); blocks[i].classList.remove('is-entering'); }
      var visible=[];
      if(startIdx===-1){
        for(var i=0;i<blocks.length;i++){
          var l=parseInt(blocks[i].getAttribute('data-level')||'0',10);
          if(i>0 && l && l<=level) break;
          blocks[i].classList.remove('is-hidden'); visible.push(blocks[i]);
        }
      } else {
        for(var i=startIdx;i<blocks.length;i++){
          var l=parseInt(blocks[i].getAttribute('data-level')||'0',10);
          if(i>startIdx && l && l<=level) break;
          blocks[i].classList.remove('is-hidden'); visible.push(blocks[i]);
        }
      }
      for(var vi=0; vi<visible.length; vi++){ (function(el,idx){ requestAnimationFrame(function(){ el.classList.add('is-entering'); }); })(visible[vi], vi); }
      var floats=docMain.querySelectorAll('.docx-float-wrap, .docx-para-float-wrap, img[data-anchor]');
      for(var f=0;f<floats.length;f++){
        var aStr=floats[f].getAttribute('data-anchor');
        var a=parseInt(aStr,10);
        if(aStr==='-1' || a===-1){
          if(startIdx===-1) floats[f].classList.remove('is-hidden');
          else floats[f].classList.add('is-hidden');
          continue;
        }
        if(isNaN(a) || a<0 || a>=blocks.length){ floats[f].classList.add('is-hidden'); continue; }
        if(blocks[a].classList.contains('is-hidden')) floats[f].classList.add('is-hidden');
        else floats[f].classList.remove('is-hidden');
      }
      showExit(true, getHeadingText(id));
      docMain.scrollTop=0;
      currentFocus=id;
    }
    document.addEventListener('click',function(e){
      var a=e.target.closest('a.toc-link');
      if(!a) return;
      var href=a.getAttribute('href');
      if(!href||href.charAt(0)!=='#') return;
      var id=href.slice(1);
      var target=document.getElementById(id);
      if(!target) return;
      e.preventDefault();
      focusHeading(id);
      setActive(id);
      history.pushState({focusId:id},'',href);
      if(isMobile()) setSidebarOpen(false);
    });
    if(headings.length && 'IntersectionObserver' in window){
      var observer=new IntersectionObserver(function(entries){
        var visible=entries.filter(function(en){return en.isIntersecting;});
        if(!visible.length) return;
        visible.sort(function(a,b){return a.boundingClientRect.top - b.boundingClientRect.top;});
        var top=visible[0].target;
        if(docMain.scrollTop<24 && titleId){ setActive(titleId); return; }
        if(top&&top.id) setActive(top.id);
      },{root:docMain,rootMargin:'-10% 0px -70% 0px',threshold:[0,1]});
      headings.forEach(function(h){observer.observe(h);});
      docMain.addEventListener('scroll',function(){ if(docMain.scrollTop<24 && titleId) setActive(titleId); },{passive:true});
      var hval=location.hash.slice(1);
      if(hval&&linkById[hval]){ focusHeading(hval); setActive(hval); }
      else if(titleId) setActive(titleId);
    } else {
      var onScroll=function(){
        if(docMain.scrollTop<24 && titleId){ setActive(titleId); return; }
        var cur=null;
        var top=docMain.scrollTop+120;
        for(var i=0;i<headings.length;i++){var hh=headings[i];if(hh.offsetTop<=top) cur=hh.id; else break;}
        if(cur) setActive(cur);
        else if(titleId) setActive(titleId);
      };
      docMain.addEventListener('scroll',onScroll,{passive:true});
      onScroll();
      var hv2=location.hash.slice(1);
      if(hv2&&linkById[hv2]){ focusHeading(hv2); setActive(hv2); }
    }
    if(exitBtn){
      exitBtn.addEventListener('click',function(){
        clearFocus();
        history.pushState({focusId:null},'',location.pathname+location.search);
      });
    }
    if(focusClear) focusClear.addEventListener('click',function(){ clearFocus(); history.pushState({focusId:null},'',location.pathname+location.search); });
    if(focusClose) focusClose.addEventListener('click',function(){ clearFocus(); history.pushState({focusId:null},'',location.pathname+location.search); });
    window.addEventListener('popstate',function(e){
      var st=e.state;
      if(st && st.focusId){ focusHeading(st.focusId); setActive(st.focusId); }
      else { clearFocus(); }
    });
    var tocSearch=document.getElementById('toc-search');
    var tocClear=document.getElementById('toc-search-clear');
    var tocNoResults=document.getElementById('toc-no-results');
    var headerSearch=document.getElementById('header-search');
    var viewerDownload=document.getElementById('viewer-download');
    var tocLinksCache=null; var tocListItemsCache=null; var origLinkHTML={};
    function ensureCache(){ if(tocLinksCache) return; tocLinksCache=Array.prototype.slice.call(document.querySelectorAll('a.toc-link')); tocListItemsCache=Array.prototype.slice.call(document.querySelectorAll('.toc-tree li')); tocLinksCache.forEach(function(a){ origLinkHTML[a.getAttribute('href')] = a.innerHTML; }); }
    function escapeReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    var searchTimer=null;
    function doSearch(q){
      ensureCache();
      var query=(q||'').trim().toLowerCase();
      if(tocClear) tocClear.classList.toggle('visible', !!query);
      if(!query){
        tocLinksCache.forEach(function(a){ a.innerHTML=origLinkHTML[a.getAttribute('href')]||a.innerHTML; a.classList.remove('is-search-hidden'); var li=a.closest('li'); if(li) li.classList.remove('is-search-hidden'); });
        tocListItemsCache.forEach(function(li){ li.classList.remove('is-search-hidden'); });
        document.querySelectorAll('.toc-parent.is-collapsed-search').forEach(function(el){ el.classList.remove('is-collapsed-search'); });
        if(tocNoResults) tocNoResults.classList.remove('visible');
        return;
      }
      var re=new RegExp('('+escapeReg(query)+')','gi');
      var anyMatch=false;
      var matchedIds={};
      tocLinksCache.forEach(function(a){
        var text=a.textContent||'';
        var isMatch=text.toLowerCase().indexOf(query)!==-1;
        if(isMatch){
          anyMatch=true; matchedIds[a.getAttribute('href')]=true;
          var orig=origLinkHTML[a.getAttribute('href')]||a.innerHTML;
          a.innerHTML=orig.replace(re,'<mark class="toc-mark">$1</mark>');
        } else {
          a.innerHTML=origLinkHTML[a.getAttribute('href')]||a.innerHTML;
        }
      });
      tocLinksCache.forEach(function(a){
        var li=a.closest('li');
        var isDirect=!!matchedIds[a.getAttribute('href')];
        var hasDescendant=false;
        if(!isDirect){
          var ul=li.querySelector('ul');
          if(ul){ var descLinks=ul.querySelectorAll('a.toc-link'); for(var i=0;i<descLinks.length;i++){ if(matchedIds[descLinks[i].getAttribute('href')]){ hasDescendant=true; break; } } }
        }
        var shouldShow=isDirect || hasDescendant;
        if(li) li.classList.toggle('is-search-hidden', !shouldShow);
        a.classList.toggle('is-search-hidden', !isDirect && !hasDescendant);
      });
      if(anyMatch){
        document.querySelectorAll('.toc-parent').forEach(function(li){
          var ul=li.querySelector('ul.toc-children');
          if(!ul) return;
          var hasVisible=!!li.querySelector('a.toc-link:not(.is-search-hidden)');
          if(hasVisible){ li.classList.remove('is-collapsed'); li.setAttribute('aria-expanded','true'); var btn=li.querySelector(':scope > .toc-row > .toc-toggle'); if(btn){ btn.setAttribute('aria-expanded','true'); } ul.hidden=false; }
        });
      }
      if(tocNoResults) tocNoResults.classList.toggle('visible', !anyMatch);
    }
    if(tocSearch){
      tocSearch.addEventListener('input', function(){ clearTimeout(searchTimer); var v=this.value; searchTimer=setTimeout(function(){ doSearch(v); },150); });
      tocSearch.addEventListener('keydown', function(e){ if(e.key==='Escape'){ this.value=''; doSearch(''); this.blur(); } });
      if(tocClear) tocClear.addEventListener('click', function(){ tocSearch.value=''; doSearch(''); tocSearch.focus(); });
    }
    document.addEventListener('keydown', function(e){ if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ var ae=document.activeElement; if(ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA')) return; e.preventDefault(); if(!isSidebarOpen()) setSidebarOpen(true); setTimeout(function(){ if(tocSearch) tocSearch.focus(); },80); } });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ var q=tocSearch?tocSearch.value:''; if(q){ tocSearch.value=''; doSearch(''); } else if(currentFocus){ clearFocus(); history.pushState({focusId:null},'',location.pathname+location.search); } } });
    if(headerSearch) headerSearch.addEventListener('click', function(){ if(!isSidebarOpen()) setSidebarOpen(true); setTimeout(function(){ if(tocSearch) tocSearch.focus(); },80); });
    if(viewerDownload) viewerDownload.addEventListener('click', function(){ try{ var htmlStr='<!DOCTYPE html>\n'+document.documentElement.outerHTML; var b=new Blob([htmlStr],{type:'text/html'}); var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=(document.title||'document')+'.html'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000); }catch(err){ window.print(); } });
    function layoutDecimalTabs(){
      document.querySelectorAll('.docx-tab-segment[data-val="decimal"]').forEach(function(seg){
        var pos=parseInt(seg.getAttribute('data-pos'),10);
        if(isNaN(pos)) return;
        var text=seg.textContent||'';
        var dotIdx=text.indexOf('.');
        if(dotIdx===-1){
          seg.style.transform="translateX(-100%)";
          return;
        }
        // Skip if already positioned
        if(seg.hasAttribute('data-decimal-offset')) return;
        try{
          // Temporarily place segment at initial tab position for measurement
          seg.style.left = pos + 'px';
          // Force layout
          seg.offsetWidth;
          
          var walker=document.createTreeWalker(seg, NodeFilter.SHOW_TEXT, null, false);
          var node, targetNode=null, localIdx=-1;
          while(node=walker.nextNode()){
            var t=node.textContent;
            var idx=t.indexOf('.');
            if(idx!==-1){ targetNode=node; localIdx=idx; break; }
          }
          if(!targetNode){ seg.style.transform="translateX(-100%)"; return; }
          var range=document.createRange();
          range.setStart(targetNode, localIdx);
          range.setEnd(targetNode, localIdx+1);
          var rect=range.getBoundingClientRect();
          
          // Use segment's own rect as reference (more reliable for abs positioned)
          var segRect=seg.getBoundingClientRect();
          // decimalOffset within segment = dot position - segment left edge
          var decimalOffsetInSeg = rect.left - segRect.left;
          // New segment left = tabPos - decimalOffsetInSeg
          var newLeft = pos - decimalOffsetInSeg;
          seg.style.left = newLeft + 'px';
          seg.style.transform = 'none';
          seg.setAttribute('data-decimal-offset', decimalOffsetInSeg);
        }catch(e){ seg.style.transform="translateX(-100%)"; }
      });
    }
    function layoutTabLeaders(){
      document.querySelectorAll('p').forEach(function(p){
        var leaders=p.querySelectorAll('.docx-tab-leader[data-pos]');
        if(!leaders.length) return;
        leaders.forEach(function(leader){
          var next=leader.nextElementSibling;
          while(next && !next.classList.contains('docx-tab-segment')) next=next.nextElementSibling;
          if(!next) return;
          var pRect=p.getBoundingClientRect();
          var prev=leader.previousElementSibling;
          while(prev && prev.classList.contains('docx-tab-leader')) prev=prev.previousElementSibling;
          var prevRect=null;
          if(prev && prev.classList.contains('docx-tab-segment')){ prevRect=prev.getBoundingClientRect(); }
          else { var range=document.createRange(); try{ range.selectNodeContents(p); var r=range.getBoundingClientRect(); prevRect={right: pRect.left, left: pRect.left}; if(r.width) prevRect=r; }catch(e){ prevRect={right:pRect.left}; } }
          var nextRect=next.getBoundingClientRect();
          var left=(prevRect?prevRect.right: pRect.left) - pRect.left;
          var right=nextRect.left - pRect.left;
          if(right>left){ leader.style.left=left+'px'; leader.style.width=(right-left)+'px'; leader.style.top='0.7em'; }
        });
      });
    }
    function layoutAllTabs(){ layoutDecimalTabs(); layoutTabLeaders(); }
    if(document.readyState==='complete') layoutAllTabs(); else window.addEventListener('load', layoutAllTabs);
    window.addEventListener('resize', layoutAllTabs);
    setTimeout(layoutAllTabs,100); setTimeout(layoutAllTabs,500);
    document.addEventListener('click', function(e){
      var m=e.target.closest('.docx-comment-range');
      if(m){
        var cid=m.getAttribute('data-comment-id');
        var el=document.getElementById('comment-'+cid);
        if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('is-active'); setTimeout(function(){el.classList.remove('is-active');},1500); var rs=document.querySelectorAll('.docx-comment-range[data-comment-id="'+cid+'"]'); rs.forEach(function(x){x.classList.add('is-active'); setTimeout(function(){x.classList.remove('is-active');},1500);}); }
        return;
      }
      var c=e.target.closest('.docx-comment, .docx-comment-reply');
      if(c && c.id && c.id.indexOf('comment-')===0){
        var cid=c.id.replace('comment-','');
        var rs=document.querySelectorAll('.docx-comment-range[data-comment-id="'+cid+'"]');
        if(rs.length){ rs[0].scrollIntoView({behavior:'smooth',block:'center'}); rs.forEach(function(x){x.classList.add('is-active'); setTimeout(function(){x.classList.remove('is-active');},1500);}); }
      }
    });
    window.__viewer={setSidebarOpen:setSidebarOpen,isSidebarOpen:isSidebarOpen,setActive:setActive};
  })();
  </script>
